const css = `

      .tb{position:fixed;bottom:0;left:0;right:0;height:calc(var(--th) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--black);border-top:1px solid rgba(255,255,255,.06);display:flex;z-index:400;}

      .post-copy{font-family:'Instrument Serif',serif;font-size:1rem;line-height:2;color:var(--charcoal);}
      .post-copy p+p{margin-top:1.5rem;}
      .gallery-filters{padding:1rem 1.25rem;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:.5rem;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--black);}
      .gallery-filters::-webkit-scrollbar{display:none;}
      @media(min-width:768px){.gallery-filters{padding:1rem 3rem;}}
      .f-label{font-family:'Space Mono',monospace;font-size:.4rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,235,225,.3);white-space:nowrap;margin-right:.25rem;}
      .f-pill{font-family:'Space Mono',monospace;font-size:.38rem;letter-spacing:.12em;text-transform:uppercase;padding:.38rem .8rem;border:1px solid rgba(240,235,225,.12);background:none;color:rgba(240,235,225,.35);cursor:pointer;white-space:nowrap;transition:all .15s;}
      .f-pill.active{border-color:var(--teal);color:var(--teal);background:rgba(240,235,225,.1);}
      .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--black);}
      @media(min-width:768px){.photo-grid{grid-template-columns:repeat(3,1fr);}}
      .photo-cell{aspect-ratio:1;background:var(--charcoal);position:relative;overflow:hidden;cursor:pointer;}
      @media(min-width:768px){.photo-cell{aspect-ratio:4/3;} .photo-cell:hover .photo-inner{transform:scale(1.04);} .photo-cap{opacity:0;transform:translateY(4px);transition:all .25s;} .photo-cell:hover .photo-cap{opacity:1;transform:none;}}
      .photo-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transition:transform .4s ease;}
      .photo-ph{font-family:'Space Mono',monospace;font-size:.35rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,235,225,.15);text-align:center;}
      .photo-cap{position:absolute;bottom:0;left:0;right:0;padding:.75rem .9rem;background:linear-gradient(to top,rgba(12,12,10,.85) 0%,transparent 100%);opacity:1;}
      .photo-cap-label{font-family:'Anton',sans-serif;font-size:.9rem;text-transform:uppercase;color:var(--bone);line-height:1;}
      .photo-cap-sub{font-family:'Space Mono',monospace;font-size:.32rem;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-top:.2rem;}
      .reveal{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s ease;}
      .reveal.visible{opacity:1;transform:none;}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
      @keyframes scanLine{0%{left:-100%}100%{left:100%}}
      @keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    
.photo-block{margin-bottom:2rem;}@media(min-width:768px){.photo-block{margin-bottom:2.5rem;}}.photo-portrait{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;display:block;border:3px solid var(--black);}
      `;
    function useReveal(){useEffect(()=>{const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.08});setTimeout(()=>document.querySelectorAll('.reveal').forEach(el=>obs.observe(el)),60);return()=>obs.disconnect();},[])}
    const MARQUEE_TEXT=["Nathan Frampton","Fanimation","Lightovation","Zionsville","Ceiling Fan Music"];
    const Footer=()=>(<footer className="footer"><div><div className="footer-name">Nathan <span>Frampton</span></div><div className="footer-sub">Central Indiana &middot; President &amp; CEO &middot; Fanimation</div></div><div className="footer-right"><ul className="footer-links"><li><a href="/music/">Music</a></li><li><a href="https://www.fanimation.com" target="_blank" rel="noreferrer">Fanimation</a></li><li><a href="https://www.linkedin.com/in/nathanframpton" target="_blank" rel="noreferrer">LinkedIn</a></li></ul><div className="footer-copy">&copy; 2026 Nathan Frampton</div></div></footer>);
    const MusicSpotlight=()=>(<section className="music-spotlight"><div className="music-copy reveal"><div className="music-kicker">&sect; 03 &mdash; Music</div><h2 className="music-title">Ceiling fan<em>music.</em></h2><p className="music-dek">Four albums in 2026. All four are about ceiling fans.</p><p className="music-proof">Rock, pop, funk, cumbia and slow jams.</p><div className="music-actions"><a className="music-cta" href="/music/">Explore the music</a><a className="music-listen" href="https://open.spotify.com/artist/6mdg7lW5KmhtJJPmtvrVoT" target="_blank" rel="noreferrer">Listen on Spotify</a></div></div><div className="music-art reveal" aria-label="Four colorful ceiling fan blades representing four albums"><div className="music-catalog"><span>Nathan Frampton / 2026</span><span>Audio airflow system</span></div><div className="music-fan" aria-hidden="true"><span className="music-blade"></span><span className="music-blade"></span><span className="music-blade"></span><span className="music-blade"></span><span className="music-hub"></span></div><div className="music-album-count">04<span>Albums / streaming everywhere</span></div></div></section>);
    const HomePage=()=>{useReveal();const marquee=[...MARQUEE_TEXT,...MARQUEE_TEXT];return(<div className="page"><section className="hero"><div className="hero-bg" aria-hidden="true">F</div><div className="hero-top"><div className="hero-tag-pill">nathanframpton.com</div><div className="hero-year">Indiana</div></div><div className="hero-name-block"><span className="hero-fname">Nathan</span><span className="hero-lname">Frampton</span></div><div className="hero-bottom"><div className="hero-roles"><div className="hero-role">President &amp; CEO &middot; Fanimation</div><div className="hero-role">Second-generation fan maker &middot; Makes music about them</div></div><div className="hero-scroll-hint"><div className="hero-scroll-line"/>Scroll</div></div></section><div className="marquee-strip" aria-hidden="true"><div className="marquee-track">{marquee.map((t,i)=>(<span key={i} className="marquee-text">{t}<span className="marquee-sep">&middot;</span></span>))}</div></div><section className="story"><div className="story-left reveal"><div className="kicker">&sect; 01 &mdash; Origin</div><h2 className="big-headline">Family<br/>business.<br/><em>Since</em><br/>1984.</h2><div className="body-copy"><p>In 1984, my father Tom left Casablanca Fan Company &mdash; where he&apos;d run the hospitality fan division &mdash; and started Fanimation in his garage in Pasadena. He bought back several designs he&apos;d created there. Those became Fanimation&apos;s first products.</p><p>I joined the business in 1990, when I was 12. Today I serve as President &amp; CEO. Fanimation is headquartered in Zionsville, Indiana.</p><p>Fanimation&apos;s headquarters also houses an <strong>antique ceiling fan museum</strong>.</p></div></div><div className="story-right reveal"><div className="photo-block"><img src={PHOTO_URL} alt="Nathan Frampton" className="photo-portrait" /></div><div className="story-stat-stack">{[{n:"1984",d:"Fanimation founded"},{n:"1990",d:"Joined the family business at age 12"},{n:"TODAY",d:"President & CEO"}].map((s,i)=>(<div className="story-stat" key={i}><div className="stat-n">{s.n}</div><div className="stat-d">{s.d.split("\n").map((l,j)=><span key={j}>{l}<br/></span>)}</div></div>))}</div></div></section><section className="fan-band reveal"><div><h2 className="fan-headline">Fanimation.<br/><em>Ceiling fans</em><br/>since 1984.</h2><p className="fan-body">Fanimation has designed ceiling fans since 1984. Today I lead the company from its headquarters in Zionsville, Indiana.</p><a href="https://www.fanimation.com" className="fan-link" target="_blank" rel="noreferrer">Visit Fanimation</a></div><div className="fan-right"><div className="fan-big-num">EST.</div><div className="fan-big-num" style={{color:"rgba(240,235,225,0.12)"}}>1984</div></div></section><section className="story" style={{borderBottom:"3px solid var(--black)"}}><div className="story-left reveal"><div className="kicker">&sect; 02 &mdash; Beyond the Company</div><h2 className="big-headline">Beyond<br/><em>Fanimation.</em></h2><div className="body-copy"><p>While chairing the Lighting Board of Governors at Dallas Market Center, I led the rebrand of its residential lighting market. The new name was <strong>Lightovation</strong>.</p><p>The show runs twice a year. I remain a member of the Lighting Board of Governors.</p><p>I also chaired Citizens for a Better Zionsville, the PAC behind the 2014 campaign to reorganize Zionsville and Perry Township and establish an elected mayor. The measure passed with 60% voter approval and created the first mayor in Zionsville&apos;s history.</p><p>The reorganization was challenged in court and ultimately upheld by the Indiana Supreme Court.</p><p>I&apos;ve also served on the Boone County Economic Development Corporation, the Boone County Convention &amp; Visitors Bureau, the Zionsville Redevelopment Commission, and the Zionsville Chamber board.</p></div></div><div className="story-right reveal"><div className="story-stat-stack">{[{n:"2015",d:"Led the Lightovation rebrand"},{n:"2014",d:"Chaired the Zionsville reorganization campaign"},{n:"UPHELD",d:"Reorganization affirmed by the Indiana Supreme Court"}].map((s,i)=>(<div className="story-stat" key={i}><div className="stat-n">{s.n}</div><div className="stat-d">{s.d.split("\n").map((l,j)=><span key={j}>{l}<br/></span>)}</div></div>))}</div></div></section><MusicSpotlight/><Footer/></div>);};
    const NAV=[{key:"home",label:"Home",icon:"\u2302"},{key:"music",label:"Music",icon:"\u266B",href:"/music/"}];
    function App(){const follow=(item)=>item.href?window.location.assign(item.href):window.scrollTo({top:0,behavior:"smooth"});return(<><style>{css}</style><div className="mh"><div className="mh-name">Nathan <span>Frampton</span></div></div><nav className="dn"><button className="dn-logo" onClick={()=>window.scrollTo({top:0,behavior:"smooth"})}><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M4%204h4.5v16.5L18%204h4.5v24H18V11.5L8.5%2028H4V4zm18.5%200H27v11h-4.5V4z%22%20fill%3D%22%2523F0EBE1%22%2F%3E%3C%2Fsvg%3E" alt="NF" style={{width:"28px",height:"28px"}} /></button><div className="dn-links">{NAV.map(l=>(<button key={l.key} className={"dn-btn"+(l.key==="home"?" active":"")} onClick={()=>follow(l)}>{l.label}</button>))}</div></nav><HomePage/><nav className="tb">{NAV.map(l=>(<button key={l.key} className={"tb-btn"+(l.key==="home"?" active":"")} onClick={()=>follow(l)}><span className="tb-icon">{l.icon}</span><span className="tb-label">{l.label}</span></button>))}</nav></>);}
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
